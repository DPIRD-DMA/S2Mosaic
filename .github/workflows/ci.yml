name: CI

on:
  push:
  pull_request:
  # Dependencies are declared without upper bounds (see pyproject.toml), so a
  # new upstream release can break the build without any commit here. The
  # install resolves fresh on every run, so this weekly job is what surfaces that --
  # without it, "fix it when it breaks" means waiting for a user to report it.
  schedule:
    - cron: "0 18 * * 0"  # Sundays 18:00 UTC (Monday morning AWST)
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    # Without a limit a hung job runs for GitHub's 6-hour default. Healthy
    # jobs take a few minutes; the notebook smoke test lives in notebooks.yml.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    # uv builds the venv from .python-version unless told otherwise, so
    # without this every matrix job silently ran the pinned dev Python (3.11
    # until this change; every passing run's jobs logged CPython 3.11.16).
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history so setuptools-scm can read tags

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v8.0.0
        with:
          cache-suffix: ${{ matrix.python-version }}

      # CPU-only torch: CI has no GPU, and the default CUDA build pulls ~3 GB
      # of nvidia-* wheels on every run (setup-uv prunes downloaded wheels
      # from its cache). --torch-backend is a uv pip option, so install with
      # the pip interface; UV_NO_SYNC stops later `uv run`s re-syncing to the
      # CUDA build. uv.lock is gitignored, so uv sync resolved fresh anyway.
      - name: Install (CPU-only torch)
        # A healthy install takes ~10 s, but a runner's connections to PyPI
        # occasionally stall outright (no download completing for 15 min), and
        # a fresh attempt gets past it. Kill a stalled attempt and retry.
        run: |
          uv venv
          for attempt in 1 2 3; do
            timeout 300 uv pip install --torch-backend cpu -e . --group dev && exit 0
            echo "::warning::install attempt $attempt failed or stalled; retrying"
          done
          exit 1
        timeout-minutes: 16

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy s2mosaic/

      - name: Test
        run: uv run pytest tests/ -x -q
