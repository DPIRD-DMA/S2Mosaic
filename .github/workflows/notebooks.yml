name: Notebooks

# Executes every example notebook against live STAC sources. It takes several
# minutes (the DEA notebook reads from Sydney, which is slow from GitHub's US
# runners), so it is kept off the per-push CI: it runs when the notebooks
# change, weekly to catch library changes that break them, and on demand.
on:
  pull_request:
    paths:
      - "examples/**"
      - ".github/workflows/notebooks.yml"
  schedule:
    - cron: "0 18 * * 0"  # Sundays 18:00 UTC (Monday morning AWST), with CI's weekly run
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history so setuptools-scm can read tags

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v8.0.0
        with:
          cache-suffix: notebooks

      - run: uv sync --all-extras --dev
        timeout-minutes: 25  # see ci.yml

      - name: Notebook smoke test
        run: uv run pytest --nbmake examples/*.ipynb -q
