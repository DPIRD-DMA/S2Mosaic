name: Notebooks

# Executes every example notebook against live STAC sources. It takes several
# minutes (the DEA notebook reads from Sydney, which is slow from GitHub's US
# runners), so it is kept off the per-push CI: it runs when the notebooks
# change, weekly to catch library changes that break them, and on demand.
on:
  pull_request:
    paths:
      - "examples/**"
      - ".github/workflows/notebooks.yml"
  schedule:
    - cron: "0 18 * * 0"  # Sundays 18:00 UTC (Monday morning AWST), with CI's weekly run
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UV_PYTHON: "3.11"
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history so setuptools-scm can read tags

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v8.0.0
        with:
          cache-suffix: notebooks

      # See ci.yml. CPU-only torch: CI has no GPU, and the default CUDA build pulls ~3 GB
      # of nvidia-* wheels on every run (setup-uv prunes downloaded wheels
      # from its cache). --torch-backend is a uv pip option, so install with
      # the pip interface; UV_NO_SYNC stops later `uv run`s re-syncing to the
      # CUDA build. uv.lock is gitignored, so uv sync resolved fresh anyway.
      - name: Install (CPU-only torch)
        # A healthy install takes ~10 s, but on some runners individual PyPI
        # downloads hang indefinitely (1-2 jobs in 11). Completed downloads
        # stay in uv's cache, so each fresh attempt resumes and clears more of
        # them: in one stalled job the third attempt had a single download
        # left. Many short attempts therefore beat a few long ones.
        run: |
          uv venv
          for attempt in 1 2 3 4 5 6 7 8; do
            timeout 90 uv pip install --torch-backend cpu -e . --group dev && exit 0
            echo "::warning::install attempt $attempt failed or stalled; retrying"
          done
          exit 1
        timeout-minutes: 14

      - name: Notebook smoke test
        run: uv run pytest --nbmake examples/*.ipynb -q
