[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "s2mosaic"
authors = [{name = "Nick Wright", email = "nicholas.wright@dpird.wa.gov.au"}]
dynamic = ["version"]
description = "Python library for making cloud-free Sentinel-2 mosaics"
requires-python = ">=3.10"
# Upper bounds are deliberately absent except where noted. Caps in a library
# propagate into every downstream resolution, so a stale one can make an
# otherwise-valid environment unsolvable. The weekly CI run in ci.yml is what
# makes this safe: it surfaces an incompatible upstream release before users
# hit it, so caps are added in response to real breakage rather than pre-emptively.
dependencies = [
    "geopandas>=1.0.3",
    # >=0.4 depends on opencv-python-headless; older versions pull the
    # non-headless build, and the two overwrite each other's cv2/ files.
    "multiclean>=0.4.0",
    # numba governs the real numpy ceiling (0.66 requires numpy<2.5), so a
    # numpy cap here would be decoration. numba itself ships a minor every
    # ~2-3 months, so capping it would break installs within a quarter.
    "numba>=0.61",
    "numpy>=1.26",
    "omnicloudmask>=1.7.1",
    # headless, to match multiclean -- both distributions install a cv2/
    # package and clobber each other when installed together.
    "opencv-python-headless>=4.10",
    "pandas>=2.0",
    "planetary-computer>=1.0.0",
    "pyproj>=3.6",
    "pystac>=1.10",
    "pystac-client>=0.8.6",
    "python-dateutil>=2.8",
    # The one intentional cap: rasterio is the deepest integration (WarpedVRT,
    # windowed reads, profile plumbing) and the place a silent geometry change
    # would hide. It has not bumped major since 2018, so this costs nothing.
    "rasterio>=1.3,<2",
    "shapely>=2.0",
    "tqdm>=4.65",
    "urllib3>=2.0",
]
license = "MIT"
license-files = ["LICENSE"]
readme = {file = "README.md", content-type = "text/markdown"}
keywords = ["sentinel-2", "satellite", "mosaic", "remote-sensing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Processing",
]

[tool.setuptools_scm]
version_file = "s2mosaic/_version.py"

[project.urls]
Homepage = "https://github.com/DPIRD-DMA/S2Mosaic"
Repository = "https://github.com/DPIRD-DMA/S2Mosaic"
Issues = "https://github.com/DPIRD-DMA/S2Mosaic/issues"
Changelog = "https://github.com/DPIRD-DMA/S2Mosaic/blob/main/CHANGELOG.md"

[tool.setuptools.package-data]
s2mosaic = ["py.typed"]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "mypy>=1.19",
    "nbmake>=1.5.5",
    "pre-commit>=4.0",
    "pytest>=8.4.0",
    "ruff>=0.12.2",
]

[tool.setuptools]
packages = ["s2mosaic", "s2mosaic.pipelines"]

[tool.mypy]
files = ["s2mosaic"]
ignore_missing_imports = true
strict = true

[tool.ruff.lint]
select = ["E", "F", "B"]

[tool.ruff]
extend-exclude = ["s2mosaic/_version.py"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"*.ipynb" = ["E402"]

[tool.pytest.ini_options]
markers = [
    "slow: end-to-end tests that hit the network and run a full mosaic pipeline",
]
addopts = "-m 'not slow'"
filterwarnings = [
    "ignore::rasterio.errors.NotGeoreferencedWarning",
    "ignore:Support for class-based `config` is deprecated:pydantic.warnings.PydanticDeprecatedSince20:planetary_computer.sas",
]
